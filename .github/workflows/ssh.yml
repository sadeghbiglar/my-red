name: academy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Only ONE academy machine may exist at any moment. Without this, a manual
# dispatch overlapping a scheduled run produced two runners, both joining with
# --hostname=academy, and Tailscale resolved the name clash by registering the
# second one as `academy-1`.
#
# cancel-in-progress: false => a run that arrives while another is live QUEUES
# instead of starting a parallel runner. Set true only if you want a manual
# dispatch to kill the live machine on purpose.
concurrency:
  group: academy-machine
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # MUST stay comfortably ABOVE the keep-alive loop in step 15, and BELOW the
    # 6h cron interval. GitHub kills the whole job at timeout-minutes WITHOUT
    # running `if: always()` steps — so when this equalled the keep-alive length
    # (340 == 340) step 17 `tailscale logout` was killed before it ran, the node
    # stayed registered in the tailnet, and the next run got the name
    # `academy-1`. Keep-alive 300 + timeout 330 + 6h cron = a 30 minute window in
    # which steps 16 and 17 always complete.
    timeout-minutes: 330
    env:
      REPO_ORIGIN: https://github.com/sadeghbiglar/academy1.git
      WF_NAME: academy

    steps:
      # - name: Wait 10 minutes
      #   run: sleep 600
        
      - name: 1. Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 2. Setup OpenSSH Server & Set Runner Password
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          echo "runner:${{ secrets.RUNNER_PASSWORD }}" | sudo chpasswd
          sudo sed -i 's/^#PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
          sudo systemctl enable ssh

      - name: 3. Setup npm, PATH, and Environment Variables Persistently
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          mkdir -p ~/.npm-global
          npm config set prefix '~/.npm-global'

          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.bashrc
          echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.profile
          export PATH="$HOME/.npm-global/bin:$PATH"

          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.bashrc
          echo "export GH_TOKEN=$GH_TOKEN" >> ~/.profile
          echo "GH_TOKEN=$GH_TOKEN" | sudo tee -a /etc/environment

          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.bashrc
          echo 'export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' >> ~/.profile
          echo 'INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"' | sudo tee -a /etc/environment

          # CodeGraph CLI — installed here, the first step where npm is on PATH.
          # ~/.hermes/config.yaml (restored later) runs
          # ~/.npm-global/bin/codegraph serve --mcp, so this must land before
          # the gateway boots. The /usr/local/bin symlink keeps the plain
          # `codegraph` command available in every shell.
          npm install -g @colbymchenry/codegraph
          if [ -x ~/.npm-global/bin/codegraph ]; then
            sudo ln -sf ~/.npm-global/bin/codegraph /usr/local/bin/codegraph
            echo "✅ CodeGraph installed: $(/usr/local/bin/codegraph --version)"
          else
            echo '⚠️ CodeGraph binary not found after installation'
          fi

      - name: 4. Install PHP 8.5 & Composer (Laravel + mysql + redis)
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y \
            php8.5 php8.5-cli php8.5-common php8.5-fpm \
            php8.5-mbstring php8.5-xml php8.5-mysql php8.5-curl php8.5-zip php8.5-bcmath php8.5-intl php8.5-gd \
            php8.5-redis php8.5-tokenizer php8.5-fileinfo php8.5-ctype \
            unzip
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          sudo php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"

      - name: 4b. Purge stale Tailscale nodes named academy / academy-N
        # An ephemeral runner that dies before step 17 (`tailscale logout`)
        # leaves its node registered in the tailnet. Tailscale then hands the
        # next runner `academy-1`, `academy-2`, ... Every leftover node matching
        # this workflow's name is deleted here BEFORE we join, so the fresh
        # runner always gets the plain name.
        #
        # Needs the secret TAILSCALE_API_KEY. Create it in Tailscale ->
        # Settings -> API keys (write access is NOT required for DELETE).
        # If the secret is absent the step is skipped and the run continues.
        env:
          TAILSCALE_API_KEY: ${{ secrets.TAILSCALE_API_KEY }}
          WF_NAME: ${{ env.WF_NAME }}
        run: |
          if [ -z "$TAILSCALE_API_KEY" ]; then
            echo "⚠️ TAILSCALE_API_KEY secret not set — skipping stale-node purge."
            echo "   Stale nodes will keep claiming the academy name."
            exit 0
          fi
          cat > /tmp/purge_stale_ts.py <<'PYEOF'
          import json, os, sys, urllib.request

          wf = os.environ["WF_NAME"]
          key = os.environ["TAILSCALE_API_KEY"]
          req = urllib.request.Request(
              "https://api.tailscale.com/api/v2/tailnet/-/devices",
              headers={"Authorization": "Bearer " + key})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  devs = json.load(r).get("devices") or []
          except Exception as exc:
              print("WARN:" + str(exc))
              sys.exit(0)
          for d in devs:
              name = (d.get("name") or "").split(".")[0]
              suffix = name[len(wf) + 1:]
              if name == wf or (name.startswith(wf + "-") and suffix.isdigit()):
                  print(d.get("id", ""))
          PYEOF
          DEVICE_IDS=$(python3 /tmp/purge_stale_ts.py | grep -v '^WARN:' | grep -v '^$' || true)
          if [ -z "$DEVICE_IDS" ]; then
            echo 'ℹ️ No stale academy node found — the name is free.'
          fi
          for id in $DEVICE_IDS; do
            if curl -fsS -X DELETE -H "Authorization: Bearer $TAILSCALE_API_KEY" "https://api.tailscale.com/api/v2/device/$id" >/dev/null; then
              echo "✅ Deleted stale Tailscale node $id"
            else
              echo "⚠️ Failed to delete node $id"
            fi
          done

      - name: 5. Connect Tailscale as Exit Node & Show Access Info
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey="$TAILSCALE_AUTHKEY" --hostname="${{ env.WF_NAME }}" --advertise-exit-node --accept-routes --accept-dns
          ACTUAL=$(sudo tailscale status --json 2>/dev/null | python3 -c "import json,sys;print((json.load(sys.stdin).get('Self') or {}).get('HostName',''))" 2>/dev/null || echo '')
          if [ "$ACTUAL" != "$WF_NAME" ]; then
            echo "❌ Joined as '$ACTUAL' instead of '$WF_NAME' — a stale node is still holding the name."
            exit 1
          fi
          echo "✅ Joined Tailscale as exactly '$ACTUAL'"

          # Enable IP forwarding (required for exit node to route traffic)
          echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
          echo 'net.ipv6.conf.all.forwarding = 1' | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p /etc/sysctl.conf

          TS_IP=$(sudo tailscale ip -4)
          echo "=================================================="
          echo "  >>> SSH & WEB SERVER ARE LIVE! <<<"
          echo "  Tailscale IP  : $TS_IP"
          echo "  Username      : runner"
          echo "  Password      : ${{ secrets.RUNNER_PASSWORD }}"
          echo "  ------------------------------------------------"
          echo "  💻 SSH: ssh runner@$TS_IP"
          echo "  🌐 Web : http://$TS_IP:8000  (Laravel)"
          echo "  🔀 9Router: http://$TS_IP:20128  (dashboard)"
          echo "  💾 Project: /home/runner/academy1"
          echo "  🌍 Exit Node: Enabled (advertise-exit-node)"
          echo "=================================================="

      - name: 6. Authenticate gh CLI & configure git credential helper
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          unset GH_TOKEN
          echo "${{ secrets.MY_PAT }}" | gh auth login --with-token
          gh auth setup-git
          gh auth status
          echo "✅ GitHub CLI authenticated as: $(gh api user -q .login)"

      - name: 7. Clone / sync academy1 and create branch
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd /home/runner
          if [ ! -d academy1 ]; then
            git clone "$REPO_ORIGIN"
          fi
          cd academy1

          # Set git identity for commits
          git config user.name "sadeghbiglar/"
          git config user.email "sadeghbiglar/@users.noreply.github.com"

          # `academy` is the release branch: approved work lands there and this is
          # what every ephemeral boot must start from. Basing on `academy` meant
          # `git checkout -B academy origin/academy` threw away any commit made on
          # the academy branch since the last runner rebuild.
          git fetch origin academy

          git checkout -B "${WF_NAME}" origin/academy
          echo "✅ Branch ${WF_NAME} created/reset from origin/academy (tree $(git rev-parse --short HEAD))"

          cp .env.example.mysql .env
          # .env.example.mysql ships APP_KEY= empty, so every fresh ephemeral
          # runner booted with MissingAppKeyException. Generate it here.
          php artisan key:generate --force

          # .hermes.md is not wanted — AGENTS.md is the authoritative instruction
          # file. Drop it from the checkout and from the index (without touching
          # academy), then exclude it so `git status` stays clean.
          if git ls-files --error-unmatch .hermes.md >/dev/null 2>&1; then
            git rm -q --cached .hermes.md
          fi
          rm -f .hermes.md
          grep -qxF '.hermes.md' .git/info/exclude 2>/dev/null \
            || echo '.hermes.md' >> .git/info/exclude
          echo '✅ .hermes.md removed from the checkout and the index'

      - name: 8. Start Docker Compose (MySQL)
        run: |
          cd /home/runner/academy1
          docker compose -f docker-compose-mysql.yml up -d
          echo '✅ Docker Compose started'

      - name: 9. Composer, NPM, Optimize, Migrate & Seed
        run: |
          cd /home/runner/academy1
          composer update --no-interaction
          npm update
          php artisan optimize
          php artisan migrate:fresh --seed --force
          echo '✅ Database migrated and seeded'

      - name: 10. Build frontend assets
        run: |
          cd /home/runner/academy1
          npm run build
          echo '✅ Frontend assets built'

      - name: 10b. Index academy1 with CodeGraph
        run: |
          cd /home/runner/academy1
          if [ -x /usr/local/bin/codegraph ]; then
            CODEGRAPH_TELEMETRY=0 codegraph init .
            CODEGRAPH_TELEMETRY=0 codegraph status .
            echo '✅ CodeGraph index built for academy1'
          else
            echo '⚠️ CodeGraph not on PATH — skipping index'
          fi

      - name: 11. Install 9router globally and create symlink
        run: |
          npm install -g 9router
          if [ -f ~/.npm-global/bin/9router ]; then
            sudo ln -sf ~/.npm-global/bin/9router /usr/local/bin/9router
            echo '✅ 9router installed and symlinked to /usr/local/bin/9router'
          else
            echo '⚠️ 9router binary not found after installation'
          fi

      - name: 12. Restore 9router db backup & start hidden (tray)
        run: |
          export INITIAL_PASSWORD="${{ secrets.RUNNER_PASSWORD }}"
          # Make sure the data dir exists
          mkdir -p ~/.9router/db
          BACKUP_DIR="${GITHUB_WORKSPACE:-.}/9router"
          # Restore the backed-up state from the repo (committed in 9router/data.sqlite)
          if [ -f "$BACKUP_DIR/data.sqlite" ]; then
            cp "$BACKUP_DIR/data.sqlite" ~/.9router/db/data.sqlite
            echo '✅ Restored 9router data.sqlite from repo backup'
          else
            echo '⚠️ 9router/data.sqlite not found in repo — starting fresh'
          fi
          # Start 9router hidden in the background (tray mode) on the default port 20128.
          # --tray is the same "hide to background" option used interactively.
          nohup 9router --tray --skip-update -p 20128 > /tmp/9router.log 2>&1 &
          sleep 6
          if curl -fsS http://localhost:20128 > /dev/null 2>&1; then
            echo '✅ 9router is live on http://localhost:20128'
          else
            echo '⚠️ 9router did not come up — check /tmp/9router.log'
          fi

      - name: 13. Install Hermes Agent & restore config + MCPs + start Telegram gateway
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_CUSTOM_API_KEY }}
          GH_TOKEN: ${{ secrets.MY_PAT }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}  # shared across all instances
          # Bot token picked dynamically: TELEGRAM_BOT_TOKEN_<WF_NAME>.
          # Uniform scheme — rename the old bare TELEGRAM_BOT_TOKEN to TELEGRAM_BOT_TOKEN_MAITY.
          TELEGRAM_BOT_TOKEN: ${{ secrets[format('TELEGRAM_BOT_TOKEN_{0}', env.WF_NAME)] }}
        run: |
          echo "✅ Using Telegram bot: $WF_NAME (token: TELEGRAM_BOT_TOKEN_${WF_NAME})"

          # 1. Install Hermes Agent
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
          echo '✅ Hermes Agent installed'
          # Make sure uvx (used by the postgis MCP) is on PATH — Hermes ships it under ~/.hermes/bin
          export PATH="$HOME/.hermes/bin:$PATH"

          # 2. Restore hermes state (config, memories, skills, cron, hooks, etc.) from repo
          mkdir -p /home/runner/.hermes
          H="${GITHUB_WORKSPACE:-.}/hermes"
          D=/home/runner/.hermes
          for item in memories skills cron hooks platforms sessions kanban; do
            [ -d "$H/$item" ] && cp -r "$H/$item" "$D/"
          done
          # The repo copy of config.yaml must never point at a dead repo path:
          # a stale `cd /home/runner/h-dashboard` makes every MCP server fail to
          # start and looks like a broken tool.
          if [ -f "$D/config.yaml" ]; then
            sed -i 's|/home/runner/h-dashboard|/home/runner/academy1|g' "$D/config.yaml"
            echo '✅ config.yaml MCP paths forced to /home/runner/academy1'
          fi
          # h-dashboard is retired — drop its skill if an old copy rides along.
          rm -rf "$D/skills/h-dashboard-session"
          for f in SOUL.md config.yaml kanban.db channel_directory.json \
                   gateway_state.json .skills_prompt_snapshot.json; do
            [ -f "$H/$f" ] && cp "$H/$f" "$D/"
          done
          echo '✅ Restored hermes state from repo (hermes/ → ~/.hermes/)'
          # 3. Write the .env with secrets pulled from GitHub Secrets.
          #    The home channel is the same as the allowed user id (single value),
          #    so we reuse TELEGRAM_ALLOWED_USERS for TELEGRAM_HOME_CHANNEL too.
          #    api_key in config.yaml is an env ref (${HERMES_CUSTOM_..._API_KEY}),
          #    so the actual key is supplied here — never committed to the repo.
          {
            echo "HERMES_CUSTOM_127_0_0_1_20128_API_KEY=${HERMES_API_KEY}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS}"
            echo "TELEGRAM_HOME_CHANNEL=${TELEGRAM_ALLOWED_USERS}"
            echo "GITHUB_TOKEN=${GH_TOKEN}"
          } > ~/.hermes/.env
          chmod 600 ~/.hermes/.env
          echo '✅ Wrote ~/.hermes/.env from secrets'

          # 4. Install MCP servers + the shadcn/improve skill.
          #    4a. Laravel Boost MCP (php artisan boost:mcp — provided by laravel/boost)
          #        Must run inside academy1: `composer require` in the workflow's
          #        working dir (the my- workspace) would install the package into
          #        the wrong project and litter composer.json/vendor/ at its root.
          cd /home/runner/academy1
          composer require laravel/boost --no-interaction 2>&1 | tail -3 || true
          if [ -f /home/runner/academy1/artisan ]; then
            php artisan boost:update 2>/dev/null || true
            echo '✅ Laravel Boost package present (MCP: php artisan boost:mcp)'
          fi

          #    4b. shadcn/improve is an AGENT SKILL, not an MCP server.
          npx -y skills add shadcn/improve 2>&1 | tail -3 || true
          echo '✅ shadcn/improve skill added'

          #    4c. Context7 MCP (documentation lookup)
          hermes mcp install context7 2>&1 || true
          echo '✅ Context7 MCP installed'

          #    4d. GitHub MCP Server (issues, PRs, code search via MCP protocol)
          echo "Y" | hermes mcp add github \
            --command npx \
            --args -y @modelcontextprotocol/server-github \
            --env "GITHUB_PERSONAL_ACCESS_TOKEN=$GH_TOKEN" \
            --connect-timeout 60 2>&1 || true
          echo '✅ GitHub MCP Server installed (26 tools: issues, PRs, code search, repos)'

          # 5. Write the mcp_servers block into ~/.hermes/config.yaml.
          #    Appended only if not already present.
          if ! grep -q "mcp_servers" ~/.hermes/config.yaml; then
            # MySQL is used for academy1 — no PostGIS MCP needed.
            printf '\nmcp_servers:\n  laravel-boost:\n    command: php\n    args: ["artisan", "boost:mcp"]\n    cwd: /home/runner/academy1\n  github:\n    command: npx\n    args: ["-y", "@modelcontextprotocol/server-github"]\n    env:\n      GITHUB_PERSONAL_ACCESS_TOKEN: "%s"\n    timeout: 120\n    connect_timeout: 60\n' "$GH_TOKEN" >> ~/.hermes/config.yaml
            echo '✅ Appended mcp_servers (laravel-boost + github) to config.yaml'
          else
            echo '✅ mcp_servers already present in config.yaml'
          fi

          # 7. Start the Hermes messaging gateway (Telegram) in the background.
          #    On GitHub runners there is no systemd, so run in foreground under nohup.
          nohup hermes gateway run --replace > /tmp/hermes-gateway.log 2>&1 &
          sleep 6
          if curl -fsS http://127.0.0.1:20128 > /dev/null 2>&1; then
            echo '✅ 9router still live; Hermes gateway launching…'
          fi
          echo '✅ Hermes gateway launch attempted (logs: /tmp/hermes-gateway.log)'

          # 8. Seed instructions -> real execution + send result to Telegram.
          #    `hermes send` alone NEVER executes — it only relays text.
          #    So: (a) run a real `hermes chat -q` warmup, (b) send the RESULT.
          #    No .hermes.md is written: AGENTS.md is the authoritative
          #    instruction file for academy1 and .hermes.md is not wanted.
          SEED_FILE="${GITHUB_WORKSPACE:-.}/hermes/seed-message.txt"
          HD_DIR=/home/runner/academy1
          if [ -f "$SEED_FILE" ]; then
            sleep 3
            rm -f "$HD_DIR/.hermes.md"
            # 8a. Real agent execution — capture output to send to Telegram.
            SEED_RESULT=$(cd "$HD_DIR" && hermes chat -q "$(cat "$SEED_FILE")" 2>/tmp/seed-warmup.log) \
              && echo '✅ Seed executed via hermes chat' \
              || echo '⚠️ Seed execution failed (see /tmp/seed-warmup.log)'
            # 8b. Send the execution result (not the raw seed) to Telegram.
            if [ -n "$SEED_RESULT" ]; then
              echo "$SEED_RESULT" > /tmp/seed-result.txt
              hermes send --to telegram --file /tmp/seed-result.txt \
                && echo '✅ Seed result sent to Telegram' \
                || echo '⚠️ Seed result failed to send'
            else
              hermes send --to telegram "academy online and ready." \
                && echo '✅ Welcome message sent to Telegram' \
                || echo '⚠️ Welcome message failed to send'
            fi
          else
            echo '⚠️ hermes/seed-message.txt not found — skipping seed prompt'
          fi

      - name: 13b. Install & restore the reserve service (hall booking, :8080)
        # /opt/reserve is on the runner's ephemeral disk, so both the install and
        # the sqlite data are gone after every rebuild. The database is restored
        # from reserve/data.sqlite committed in this repo (mirrors the way
        # 9router/data.sqlite is handled in steps 12 and 16).
        run: |
          set -euo pipefail
          TS_IP=$(sudo tailscale ip -4 | head -1)
          cd "${GITHUB_WORKSPACE:-.}"
          curl -sSL -o /tmp/reserve-deploy.sh \
            https://raw.githubusercontent.com/jackjons676-rebecca/reserve/academy/deploy.sh
          sudo bash /tmp/reserve-deploy.sh \
            --repo https://github.com/jackjons676-rebecca/reserve.git \
            --ip "$TS_IP" 2>&1 | tail -20
          echo '✅ reserve installed'

          # Restore the database only on a genuinely fresh install. deploy.sh
          # already creates an empty reserve.db on first install, so the file's
          # presence is the reliable "already have data" test — never overwrite a
          # populated database with the repo copy.
          REPO_DB="${GITHUB_WORKSPACE:-.}/reserve/data.sqlite"
          if [ -f "$REPO_DB" ]; then
            # Refuse an empty/truncated backup rather than installing a shell db
            # that would look like data loss.
            NTABLES=$(node -e "
              const {DatabaseSync} = require('node:sqlite');
              const d = new DatabaseSync(process.argv[1], { readOnly: true });
              console.log(d.prepare(\"SELECT count(*) c FROM sqlite_master WHERE type='table'\").get().c);
              d.close();
            " "$REPO_DB" 2>/dev/null || echo 0)
            if [ "${NTABLES:-0}" -lt 5 ]; then
              echo "⚠️ Repo backup has only ${NTABLES:-0} tables — treating it as invalid, NOT restoring"
              echo "   (a valid reserve database has 7: bookings halls kinds sessions settings users + sqlite_sequence)"
            else
              sudo systemctl stop reserve
              sudo cp "$REPO_DB" /opt/reserve/data/reserve.db
              sudo chown runner:runner /opt/reserve/data/reserve.db
              # Stale WAL/SHM from the fresh install would be replayed over the
              # restored database and corrupt it.
              sudo rm -f /opt/reserve/data/reserve.db-wal /opt/reserve/data/reserve.db-shm
              sudo chmod 600 /opt/reserve/data/reserve.db
              sudo systemctl start reserve
              sleep 3
              echo "✅ Restored reserve.db from the repo backup (${NTABLES} tables)"
            fi
          else
            echo 'ℹ️ No reserve backup in the repo yet — first run starts empty (needsSetup:true)'
          fi

          for _ in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/api/status >/dev/null 2>&1; then
              echo "✅ reserve is live: $(curl -fsS http://127.0.0.1:8080/api/status)"
              break
            fi
            sleep 2
          done

      - name: 14. Start Laravel Development Server
        run: |
          cd /home/runner/academy1
          nohup php artisan serve --host=0.0.0.0 > /dev/null 2>&1 &
          echo '✅ Laravel server started on port 8000'

      - name: 14b. Development autopilot (one queued issue per boot)
        # The user asked for uninterrupted progress: on every boot, take the next
        # issue from .academy/queue.json, implement it, gate on tests + pint,
        # commit and push to `academy`. `academy` is never touched — that stays the
        # release branch and requires the user's approval.
        #
        # Runs AFTER the servers are up so a failure here never costs the
        # machine; and AFTER the git-based state sync step so the queue file the
        # agent reads is the freshly-pushed one.
        continue-on-error: true
        run: |
          set -uo pipefail
          SCRIPT=/home/runner/.hermes/skills/academy1-report/scripts/academy-autopilot.sh
          if [ ! -f "$SCRIPT" ]; then
            echo "⚠️ autopilot script missing at $SCRIPT — restoring it from the repo"
            mkdir -p "$(dirname "$SCRIPT")"
            curl -sSL -o "$SCRIPT" \
              https://raw.githubusercontent.com/sadeghbiglar/academy1/academy/scripts/academy-autopilot.sh \
              || { echo "⚠️ could not fetch autopilot script — skipping this run"; exit 0; }
          fi
          chmod +x "$SCRIPT"
          echo "✅ autopilot starting (log: /tmp/autopilot.log)"
          # Long timeout: one issue can mean many files and a full test cycle.
          # A slow run that overruns the job must not be silently killed without
          # leaving a trace, so the log is tailed below.
          timeout 2400 "$SCRIPT" > /tmp/autopilot.log 2>&1
          RC=$?
          echo "--- autopilot log (last 60 lines) ---"
          tail -60 /tmp/autopilot.log || true
          if [ $RC -eq 124 ]; then
            echo "⚠️ autopilot hit its 2400s cap — the issue may be unfinished; the queue keeps it in_progress"
          elif [ $RC -ne 0 ]; then
            echo "⚠️ autopilot failed rc=$RC — queue unchanged, will retry next boot"
          else
            echo "✅ autopilot completed this boot's issue"
          fi

      - name: 15. Server Keep-Alive (300m)
        run: |
          for i in {1..300}; do
            sleep 60
            echo "[$i/300] Server is active (SSH + Laravel on port 8000)..."
          done

      - name: 16. Sync hermes state, 9router data & reserve database back to my-red
        if: always()
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          cd "${GITHUB_WORKSPACE:-.}"
          git config user.name "sadeghbiglar/"
          git config user.email "sadeghbiglar/@users.noreply.github.com"
          # Authenticate with PAT for push
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/sadeghbiglar/my-red.git"

          H=/home/runner/.hermes
          HDEST=hermes

          # 1. Copy all dynamic hermes dirs & files back to repo
          mkdir -p "$HDEST"
          for item in memories skills cron hooks platforms sessions kanban; do
            [ -d "$H/$item" ] && cp -r "$H/$item" "$HDEST/"
          done
          rm -rf "$HDEST/skills/h-dashboard-session"
          if [ -f "$HDEST/config.yaml" ]; then
            sed -i 's|/home/runner/h-dashboard|/home/runner/academy1|g' "$HDEST/config.yaml"
          fi
          for f in SOUL.md kanban.db state.db channel_directory.json \
                   gateway_state.json .skills_prompt_snapshot.json; do
            [ -f "$H/$f" ] && cp "$H/$f" "$HDEST/"
          done
          echo '✅ Copied hermes dynamic state → hermes/ for backup'

          # 2. Copy 9router database back to repo
          mkdir -p 9router
          if [ -f ~/.9router/db/data.sqlite ]; then
            cp ~/.9router/db/data.sqlite 9router/data.sqlite
            echo '✅ Copied 9router data.sqlite → 9router/ for backup'
          fi

          # 2b. Copy the reserve database back to the repo.
          # The service MUST be stopped first: sqlite in WAL mode keeps recent
          # writes in reserve.db-wal, and copying only reserve.db would silently
          # lose the newest bookings. A clean shutdown checkpoints and removes the
          # -wal file, so the single .db file is then complete.
          if systemctl list-unit-files reserve.service >/dev/null 2>&1; then
            sudo systemctl stop reserve || true
            sleep 2
            mkdir -p reserve
            # COPYING reserve.db DIRECTLY IS NOT ENOUGH. The app runs sqlite in
            # WAL mode, so on a fresh install reserve.db is 4096 bytes and every
            # table lives in reserve.db-wal (hundreds of KB). Copying the .db
            # alone silently backs up an EMPTY database.
            # Verified on this machine: reserve.db -> 0 tables; the VACUUM INTO
            # output -> 7 tables, 7 halls, integrity ok.
            sudo chmod 755 /opt/reserve /opt/reserve/data
            if sudo test -f /opt/reserve/data/reserve.db; then
              if node -e "
                const {DatabaseSync} = require('node:sqlite');
                const db = new DatabaseSync('/opt/reserve/data/reserve.db');
                db.exec('PRAGMA wal_checkpoint(TRUNCATE)');
                db.exec(\"VACUUM INTO '$PWD/reserve/data.sqlite'\");
                db.close();
              " 2>/dev/null; then
                echo "✅ Backed up reserve database → reserve/data.sqlite ($(stat -c %s reserve/data.sqlite) bytes)"
              else
                echo '⚠️ VACUUM INTO failed — reserve/data.sqlite left untouched (never copy the .db directly)'
              fi
            else
              echo '⚠️ /opt/reserve/data/reserve.db not found — nothing to back up'
            fi
            sudo systemctl start reserve || true
          else
            echo 'ℹ️ reserve.service not installed on this runner — nothing to back up'
          fi

          # 3. Commit & push if anything changed
          if git diff --quiet && git diff --cached --quiet; then
            echo 'ℹ️ No changes to commit'
          else
            git add hermes/ 9router/ reserve/ 2>/dev/null || true
            git commit -m "Sync hermes state, 9router data & reserve database from academy instance"
            # Pull first in case another run pushed before us
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "${{ github.ref_name }}" || echo '⚠️ Push failed — changes saved locally'
            echo '✅ Hermes, 9router & reserve data synced to my-red'
          fi

      - name: 17. Tailscale Logout (frees the `academy` name for the next run)
        # This MUST run. If it is skipped the node stays registered in the tailnet
        # and the next runner joins as `academy-1`. `always()` alone is not enough:
        # a job killed at timeout-minutes never runs it, which is why timeout is
        # set above the keep-alive length.
        if: always()
        run: |
          sudo tailscale logout || true
          echo "✅ Tailscale logout executed — hostname freed"
          sleep 5
          if sudo tailscale status --json >/dev/null 2>&1; then
            echo "⚠️ tailscaled still reports a state after logout — the node may linger in the tailnet."
          else
            echo "✅ tailscaled is down — node fully removed"
          fi
